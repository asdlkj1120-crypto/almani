<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07533d"><title>ALMANI 얼마니?</title>
<link rel="icon" href="icon.png">
<style>
:root{--green:#07533d;--cream:#f7f3e7;--muted:#77766e}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:var(--green)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:25px;background:linear-gradient(#f3eedf,#f9f6eb)}.hero{height:clamp(190px,51vw,245px);background:#d6d7b8 url('hero.png') center center/cover no-repeat;position:relative}.lang{position:absolute;right:14px;top:14px;border:1px solid #e7e0cb;background:#fffaf0e8;border-radius:25px;padding:9px 13px;font-size:14px;font-weight:750;box-shadow:0 3px 12px #0001}.main{padding:0 15px}.currencies{display:flex;gap:10px;align-items:center;margin-top:-12px;position:relative}.currency{background:#fffdfa;box-shadow:0 4px 15px #30240b12;border:1px solid #e9e2d5;border-radius:24px;flex:1;padding:15px 5px;text-align:center;font-size:18px;font-weight:850;white-space:nowrap}.swap{width:52px;height:52px;border:0;border-radius:50%;background:var(--green);color:white;font-size:30px;box-shadow:0 4px 12px #003d2a30}.card{position:relative;margin-top:13px;border-radius:24px;padding:16px 17px;box-shadow:0 4px 14px #30240b10}.input{background:#fffdfa}.output{background:#edf3de}.label{font-size:15px;color:#7c7c76;font-weight:750}.number{font-size:clamp(36px,9.5vw,56px);font-weight:900;text-align:center;letter-spacing:-1.5px;margin-top:12px;overflow-wrap:anywhere;line-height:1.2;min-height:60px;display:flex;align-items:center;justify-content:center;gap:4px}.unit{font-size:.55em;margin-left:4px}.rate{display:block;text-align:center;margin:8px 0 4px;font-size:12px;color:#686a59}.rate button{border:0;background:#f7d778;border-radius:30px;padding:7px 11px;color:#3d3a17;font-weight:800}.rate-note{font-size:11px;color:#777;text-align:center;margin-top:6px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.keypad button{border:0;border-radius:21px;background:#fffdfa;color:var(--green);font-size:29px;font-weight:800;min-height:64px;box-shadow:0 3px 8px #30240b10}.keypad button:active{transform:scale(.97)}.keypad .clear{background:#f8cbc1;color:#8a3028}.keypad .del{background:var(--green);color:white}.bigbtn{width:100%;background:var(--green);color:white;border:0;border-radius:22px;font-size:20px;font-weight:850;padding:19px;margin-top:15px;box-shadow:0 4px 13px #003d2a25}.foot{text-align:center;font-size:11px;color:#969185;margin-top:17px}.rate-top{display:flex;justify-content:center;margin-top:10px}.rate-top .rate{margin:0}.input .number{margin-top:14px}.output .number{margin-top:8px}.output .label{text-align:left}.ad-space{min-height:28px}.overlay{position:fixed;inset:0;background:#f8f3e6;z-index:50;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}.overlay.on{display:flex}.overlay .ovlabel{font-size:20px;font-weight:800;color:#75796b}.overlay .ovnumber{font-size:clamp(39px,11vw,70px);font-weight:950;overflow-wrap:anywhere;max-width:100%;margin:12px 0}.overlay hr{border:0;border-top:2px solid #e0ddcd;width:85%;margin:26px 0}.overlay button{margin-top:35px;border:0;background:var(--green);color:white;border-radius:20px;padding:17px 55px;font-weight:800;font-size:18px}@media(max-width:370px){.hero{height:190px}.keypad button{min-height:56px}.currency{font-size:17px}}

/* 한 화면 맞춤: 모바일 높이에 따라 자동 압축 */
html,body{min-height:100%;}
.app{min-height:100dvh;padding-bottom:6px;}
.hero{height:clamp(105px,22dvh,190px);background-size:cover;}
.main{padding:0 13px 8px;}
.currencies{margin-top:-9px;gap:8px;}
.currency{padding:10px 4px;border-radius:17px;font-size:16px;}
.swap{width:43px;height:43px;font-size:25px;flex-shrink:0;}
.card{margin-top:8px;padding:10px 14px;border-radius:18px;}
.label{font-size:13px;}
.number,.input .number,.output .number{font-size:clamp(29px,7.6vw,43px);min-height:38px;line-height:1.08;margin-top:3px;}
.rate-top{margin-top:3px;}
.rate button{padding:5px 10px;font-size:12px;}
.rate-note{margin-top:3px;font-size:10px;}
.keypad{gap:7px;margin-top:9px;}
.keypad button{min-height:clamp(37px,6.8dvh,55px);border-radius:14px;font-size:24px;}
.bigbtn{margin-top:9px;padding:12px;border-radius:16px;font-size:17px;}
.foot{margin-top:7px;font-size:10px;}
.ad-space{display:none;}
@media(max-height:690px){.hero{height:clamp(90px,18dvh,130px)}.card{padding:7px 12px;margin-top:6px}.number,.input .number,.output .number{min-height:30px;font-size:clamp(27px,7vw,37px)}.keypad{margin-top:6px;gap:5px}.keypad button{min-height:clamp(34px,6dvh,45px)}.bigbtn{padding:9px;margin-top:7px}.foot{margin-top:4px}}
@media(min-width:600px){.hero{height:190px}.keypad button{min-height:53px}}

/* 상단 원본 전체 표시: cover 크롭 제거 */
.hero{height:auto!important;aspect-ratio:1024/480;background-size:100% 100%!important;background-position:center!important;background-repeat:no-repeat!important;}
/* 상단을 온전히 보여주되 작은 화면에서는 아래 공간을 조금 절약 */
@media(max-height:780px){.card{padding-top:7px;padding-bottom:7px}.keypad{gap:5px;margin-top:7px}.keypad button{min-height:clamp(34px,5.9dvh,49px)}.bigbtn{padding:10px;margin-top:7px}.foot{margin-top:4px}}
</style></head>
<body><div class="app"><div class="hero"></div><main class="main"><div class="currencies"><div class="currency" id="from">🇻🇳 VND</div><button class="swap" onclick="swap()" aria-label="통화 전환">⇄</button><div class="currency" id="to">🇰🇷 KRW</div></div><section class="card input"><div class="label" id="inputLabel">베트남 돈</div><div class="number" id="inputNumber">0<span class="unit">₫</span></div></section><section class="card output"><div class="label" id="outputLabel">한국 원화</div><div class="rate-top"><div class="rate"><button onclick="editRate()" id="rateBtn">1,000₫ ≈ 56.7원 ✎</button></div></div><div class="number" id="outputNumber">0<span class="unit">원</span></div><div class="rate-note" id="rateNote">환율 확인 중…</div></section><div class="keypad"><button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="clear" onclick="clearInput()">C</button><button onclick="press('0')">0</button><button class="del" onclick="erase()">⌫</button></div><button class="bigbtn" id="bigBtn" onclick="showBig()">⛶ 크게 보여주기</button><div class="foot">ALMANI · 여행 중 간편 환율 계산</div><div class="ad-space" aria-hidden="true"></div></main></div><div class="overlay" id="overlay"><div class="ovlabel" id="ovFromLabel"></div><div class="ovnumber" id="ovFrom"></div><hr><div class="ovlabel" id="ovToLabel"></div><div class="ovnumber" id="ovTo"></div><button onclick="closeBig()" id="backBtn">돌아가기</button></div>
<script>
let amount='0',reverse=false,vi=false;
const savedRate=Number(localStorage.getItem('almani_live_rate'));
let rate=savedRate>0?savedRate:0.0567;
let rateDate=localStorage.getItem('almani_rate_date')||'';
let rateStatus=savedRate>0?'cached':'fallback';
let manualRate=Number(localStorage.getItem('almani_manual_rate'))||0;
if(manualRate>0){rate=manualRate;rateStatus='manual';}

const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
function render(){const n=Number(amount),converted=reverse?n/rate:n*rate,fu=reverse?'원':'₫',tu=reverse?'₫':'원';$('from').textContent=reverse?'🇰🇷 KRW':'🇻🇳 VND';$('to').textContent=reverse?'🇻🇳 VND':'🇰🇷 KRW';$('inputLabel').textContent=reverse?(vi?'Tiền Hàn Quốc':'한국 원화'):(vi?'Tiền Việt Nam':'베트남 돈');$('outputLabel').textContent=reverse?(vi?'Tiền Việt Nam':'베트남 돈'):(vi?'Tiền Hàn Quốc':'한국 원화');$('inputNumber').innerHTML=fmt(n)+'<span class="unit">'+fu+'</span>';$('outputNumber').innerHTML=fmt(converted)+'<span class="unit">'+tu+'</span>';$('rateBtn').textContent='1,000₫ ≈ '+(rate*1000).toLocaleString('ko-KR',{maximumFractionDigits:3})+'원 ✎';$('rateNote').textContent=rateStatus==='live'?(vi?'Tỷ giá '+rateDate+' · tự động':'기준 '+rateDate+' · 자동 업데이트'):rateStatus==='cached'?(vi?'Tỷ giá đã lưu · ngoại tuyến':'저장된 환율 · 오프라인'):rateStatus==='manual'?(vi?'Tỷ giá nhập thủ công':'직접 설정한 환율'):(vi?'Tỷ giá tham khảo · kiểm tra lại':'임시 참고 환율 · 확인 필요');$('bigBtn').textContent=vi?'⛶ Hiển thị lớn':'⛶ 크게 보여주기';$('backBtn').textContent=vi?'Quay lại':'돌아가기';$('ovFromLabel').textContent=reverse?'🇰🇷 KRW':'🇻🇳 VND';$('ovToLabel').textContent=reverse?'🇻🇳 VND':'🇰🇷 KRW';$('ovFrom').textContent=fmt(n)+' '+fu;$('ovTo').textContent=fmt(converted)+' '+tu;}
function press(d){if(amount.length>=12)return;amount=amount==='0'?d:amount+d;render()}function clearInput(){amount='0';render()}function erase(){amount=amount.slice(0,-1)||'0';render()}function swap(){reverse=!reverse;amount='0';render()}function toggleLang(){vi=!vi;render()}function showBig(){$('overlay').classList.add('on');render()}function closeBig(){$('overlay').classList.remove('on')}function editRate(){
 const v=prompt('1,000동당 원화 금액을 입력하세요.\n자동 환율로 되돌리려면 "자동"을 입력하세요.',String((rate*1000).toFixed(3)));
 if(v===null)return;
 if(v.trim()==='자동'){
  localStorage.removeItem('almani_manual_rate');manualRate=0;
  rateStatus='fallback';loadRate();return;
 }
 const n=Number(v.replace(/,/g,''));
 if(!Number.isFinite(n)||n<=0){alert('올바른 숫자를 입력해 주세요.');return;}
 rate=n/1000;manualRate=rate;rateStatus='manual';
 localStorage.setItem('almani_manual_rate',String(rate));render();
}
async function loadRate(){
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  let response;
  try{response=await fetch('https://api.frankfurter.dev/v2/rate/VND/KRW',{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer);}
  if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();
  if(data.base!=='VND'||data.quote!=='KRW'||!(Number(data.rate)>0)||!/^\d{4}-\d{2}-\d{2}$/.test(data.date))throw Error('invalid rate');
  localStorage.setItem('almani_live_rate',String(data.rate));
  localStorage.setItem('almani_rate_date',data.date);
  rateDate=data.date;
  if(!manualRate){rate=Number(data.rate);rateStatus='live';}
 }catch(e){
  if(!manualRate){rateStatus=savedRate>0?'cached':'fallback';}
 }finally{render();}
}

document.addEventListener('keydown',e=>{if($('overlay').classList.contains('on')){if(e.key==='Escape')closeBig();return}if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')erase();else if(e.key==='Escape')clearInput()});render();loadRate();
</script></body></html>
